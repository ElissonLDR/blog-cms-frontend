<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog CMS — Artigos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
</head>
<body class="blog-publico">
    <header class="blog-header">
        <div class="container blog-header__inner">
            <a href="blog.html" class="blog-header__brand">
                <span class="blog-header__icone">✦</span>
                <div>
                    <strong>Blog CMS</strong>
                    <small>Artigos publicados</small>
                </div>
            </a>
            <a href="index.html" class="btn btn-sm btn-outline-light">Painel administrativo</a>
        </div>
    </header>

    <main class="blog-main">
        <div class="container" id="blog-conteudo">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="text-muted mt-3 mb-0">Carregando artigos...</p>
            </div>
        </div>
    </main>

    <footer class="blog-footer">
        <div class="container text-center">
            <small class="text-muted">Blog CMS — Pós-graduação Full Stack</small>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/blog.js"></script>
</body>
</html>
